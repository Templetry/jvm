name: Verify forms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so upstream drift surfaces here and not in a user project.
    - cron: "0 6 * * 1"

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spring-boot:
    name: spring-boot (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: default, args: "" }
          - { name: minimal, args: "--preset minimal" }
    steps:
      - uses: actions/checkout@v4
      - uses: Templetry/.github/actions/setup-templetry@main
      - name: Render
        run: |
          templetry render --template ./spring-boot --out "$RUNNER_TEMP/out" \
            --set "project_name=Verify App" --set "base_package=com.verify.app" ${{ matrix.args }}
          chmod +x "$RUNNER_TEMP/out/gradlew"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build rendered output
        working-directory: ${{ runner.temp }}/out
        run: ./gradlew build --no-daemon --stacktrace

  ktor:
    name: ktor (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: default, args: "" }
          - { name: minimal, args: "--preset minimal" }
    steps:
      - uses: actions/checkout@v4
      - uses: Templetry/.github/actions/setup-templetry@main
      - name: Render
        run: |
          templetry render --template ./ktor --out "$RUNNER_TEMP/out" \
            --set "project_name=Verify App" --set "base_package=com.verify.app" ${{ matrix.args }}
          chmod +x "$RUNNER_TEMP/out/gradlew"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build rendered output
        working-directory: ${{ runner.temp }}/out
        run: ./gradlew build --no-daemon --stacktrace
